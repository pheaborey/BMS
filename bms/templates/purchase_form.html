{% extends "base.html" %}
{% block content %}
<form class="card form-card" id="po-form" method="post" action="/purchases/save" data-currency="{{ settings.currency }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <div class="form-grid">
    <label class="field">
      <span>{{ t('supplier') }} *</span>
      <select name="supplier_id" required>
        <option value="">{{ t('select_supplier') }}</option>
        {% for supplier in suppliers %}
        <option value="{{ supplier.id }}">{{ supplier.name }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="field">
      <span>{{ t('order_date') }}</span>
      <input type="date" name="order_date" value="{{ order_date }}" required>
    </label>
    <label class="field span-2">
      <span>{{ t('notes') }}</span>
      <textarea name="notes" rows="2"></textarea>
    </label>
  </div>
  <div class="table-wrap">
    <table class="lines">
      <thead>
        <tr><th>{{ t('product') }}</th><th>{{ t('qty') }}</th><th>{{ t('unit_cost') }}</th><th class="num">{{ t('line_total') }}</th><th></th></tr>
      </thead>
      <tbody id="po-lines"></tbody>
    </table>
  </div>
  <div class="po-foot">
    <button class="btn" type="button" id="add-line">{{ t('add_line') }}</button>
    <p class="po-total"><span>{{ t('total') }}</span> <strong id="po-total">0</strong></p>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">{{ t('save') }}</button>
    <a class="btn btn-ghost" href="/purchases">{{ t('cancel') }}</a>
  </div>
</form>
<template id="line-tpl">
  <tr>
    <td>
      <select name="product_id" required>
        <option value="">{{ t('product') }}</option>
        {% for product in products %}
        <option value="{{ product.id }}" data-cost="{{ product.cost }}">{{ product.name }} · {{ product.sku }}</option>
        {% endfor %}
      </select>
    </td>
    <td><input class="qty" name="qty" type="number" min="0.01" step="0.01" value="1" required></td>
    <td><input class="cost" name="cost" type="number" min="0" step="0.01" value="0" required></td>
    <td class="line-total num">0</td>
    <td><button class="link danger remove-line" type="button">{{ t('remove') }}</button></td>
  </tr>
</template>
{% endblock %}
